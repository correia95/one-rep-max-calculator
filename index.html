    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do you calculate a one-rep max?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Take a weight you lifted for a known number of reps and apply a formula. The Epley formula is weight times one plus reps over thirty; for 100 kg for 5 reps that is about 117 kg. The formulas agree closely at low reps and diverge above about ten."
            }
          },
          {
            "@type": "Question",
            "name": "Which 1RM formula is most accurate?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "None is universally best. Epley is the most common, Brzycki is more conservative, and O'Conner most conservative of all. Using the average of several is a reasonable default. Accuracy is best from sets of two to five reps."
            }
          },
          {
            "@type": "Question",
            "name": "What weight should I use for 5 sets of 5?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Roughly 85 to 87 percent of your one-rep max for a challenging 5x5. The training table on this page converts your estimated 1RM into the weight for every common percentage and rep range."
            }
          },
          {
            "@type": "Question",
            "name": "Is it safe to test my true one-rep max?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A true max attempt should be well warmed up, done with good form, and on the bench press and squat with a spotter or safety pins. For most people an estimate from a set of 3 to 5 reps is enough and lower risk. This is general training information, not coaching or medical advice."
            }
          }
        ]
      }
    </script>
